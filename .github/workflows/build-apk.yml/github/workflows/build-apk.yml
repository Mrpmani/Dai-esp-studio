name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o "dai esp studio.zip" || unzip -o *.zip
          ls -la
          # If zip contains a folder, move its content to root
          if [ -d "Dai-esp-studio" ]; then mv Dai-esp-studio/*.; fi
          if [ -d "dai-esp-studio" ]; then mv dai-esp-studio/*.; fi
          if [ -d "dai esp studio" ]; then mv "dai esp studio"/*.; fi
          ls -la
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          chmod +x gradlew
         ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DAI-ESP-APK
          path: app/build/outputs/apk/debug/app-debug.apk
